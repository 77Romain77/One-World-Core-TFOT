name: Fix hunger patch format

on:
  push:
    branches:
      - agent/fix-spigot-hunger-config

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Player patch hunks
        shell: python
        run: |
          from pathlib import Path
          p = Path('patches/minecraft/net/minecraft/world/entity/player/Player.java.patch')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '         this.m_36399_(this.m_9236_().spigotConfig.jumpSprintExhaustion);': '-         this.m_36399_(0.2F)\n+         this.m_36399_(this.m_9236_().spigotConfig.jumpSprintExhaustion);',
              '         this.m_36399_(this.m_9236_().spigotConfig.jumpWalkExhaustion);': '-         this.m_36399_(0.05F);\n+         this.m_36399_(this.m_9236_().spigotConfig.jumpWalkExhaustion);',
              '               this.m_36399_(this.m_9236_().spigotConfig.swimMultiplier * (float)i * 0.01F);': '-               this.m_36399_(0.01F * (float)i * 0.01F);\n+               this.m_36399_(this.m_9236_().spigotConfig.swimMultiplier * (float)i * 0.01F);',
              '               this.m_36399_(this.m_9236_().spigotConfig.swimMultiplier * (float)j * 0.01F);': '-               this.m_36399_(0.01F * (float)j * 0.01F);\n+               this.m_36399_(this.m_9236_().spigotConfig.swimMultiplier * (float)j * 0.01F);',
              '               this.m_36399_(this.m_9236_().spigotConfig.swimMultiplier * (float)k * 0.01F);': '-               this.m_36399_(0.01F * (float)k * 0.01F);\n+               this.m_36399_(this.m_9236_().spigotConfig.swimMultiplier * (float)k * 0.01F);',
              '                  this.m_36399_(this.m_9236_().spigotConfig.sprintMultiplier * (float)l * 0.01F);': '-                  this.m_36399_(0.1F * (float)l * 0.01F);\n+                  this.m_36399_(this.m_9236_().spigotConfig.sprintMultiplier * (float)l * 0.01F);',
              '                  this.m_36399_(this.m_9236_().spigotConfig.otherMultiplier * (float)l * 0.01F);': '-                  this.m_36399_(0.0F * (float)l * 0.01F);\n+                  this.m_36399_(this.m_9236_().spigotConfig.otherMultiplier * (float)l * 0.01F);',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count == 0:
                  continue
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-hunger-patch-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/minecraft/net/minecraft/world/entity/player/Player.java.patch .github/workflows/fix-hunger-patch-format.yml
          git commit -m "Fix hunger patch hunk format [skip ci]"
          git push origin HEAD:agent/fix-spigot-hunger-config
